<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo Conceptual ER Integral - Recolección de Basura</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 1400px;
            overflow-x: auto;
        }
        h2 {
            text-align: center;
            color: #0f172a;
            margin-bottom: 30px;
        }
        svg {
            width: 100%;
            height: auto;
            min-width: 1300px;
        }
        .entity {
            fill: #ffffff;
            stroke: #000000;
            stroke-width: 2.5;
        }
        .entity-text {
            font-size: 14px;
            font-weight: bold;
            fill: #000000;
            text-anchor: middle;
            dominant-baseline: middle;
        }
        .relationship {
            fill: #ffffff;
            stroke: #000000;
            stroke-width: 2;
        }
        .relationship-text {
            font-size: 13px;
            font-weight: bold;
            fill: #000000;
            text-anchor: middle;
            dominant-baseline: middle;
        }
        .line {
            stroke: #000000;
            stroke-width: 2.5;
            fill: none;
        }
        .cardinality {
            font-size: 15px;
            font-weight: bold;
            fill: #000000;
        }
        .isa-triangle {
            fill: #ffffff;
            stroke: #000000;
            stroke-width: 2.5;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Diagrama ER: Gestión Operativa de Aseo Urbano e Insumos</h2>
    
    <!-- Lienzo SVG -->
    <svg viewBox="0 0 1350 720">
        
        <!-- ================= LÍNEAS DE CONEXIÓN (Geometría Ortogonal) ================= -->
        
        <!-- MACRODISTRITO a ZONA -->
        <polyline class="line" points="160,110 160,250" />
        
        <!-- ZONA a RUTA -->
        <polyline class="line" points="160,310 160,450" />
        
        <!-- JEFE_AREA a ZONA (Supervisa) -->
        <polyline class="line" points="380,280 240,280" />
        
        <!-- RUTA a CHOFER (Asignada) -->
        <polyline class="line" points="240,480 460,480 460,410" />
        <polyline class="line" points="460,350 460,330 720,330 720,310" />
        
        <!-- CHOFER a VEHÍCULO (Conduce) -->
        <polyline class="line" points="760,310 760,570" />
        
        <!-- VEHÍCULO a CENTRO DESTINO (Descarga) -->
        <polyline class="line" points="680,600 240,600" />
        
        <!-- CHOFER a RECOLECTOR (Apoya a) -->
        <polyline class="line" points="840,280 980,280" />
        
        <!-- VEHÍCULO a INSUMO (Consume - N a M) -->
        <polyline class="line" points="840,600 980,600" />
        
        <!-- PERSONA a INSUMO (Recibe - N a M - Línea de marco exterior derecho) -->
        <polyline class="line" points="840,80 1220,80 1220,310" />
        <polyline class="line" points="1220,370 1220,600 1140,600" />

        <!-- ================= JERARQUÍA ISA (Herencia de Persona) ================= -->
        
        <polyline class="line" points="760,110 760,140" />
        <polyline class="line" points="760,200 760,220" />
        <!-- Línea horizontal de distribución -->
        <polyline class="line" points="460,220 1060,220" />
        <!-- Caídas a los hijos -->
        <polyline class="line" points="460,220 460,250" />
        <polyline class="line" points="760,220 760,250" />
        <polyline class="line" points="1060,220 1060,250" />
        
        <polygon class="isa-triangle" points="720,140 800,140 760,200" />
        <text x="760" y="165" class="entity-text">ISA</text>


        <!-- ================= ROMBOS (RELACIONES) ================= -->
        
        <!-- Contiene -->
        <polygon class="relationship" points="160,150 200,180 160,210 120,180" />
        <text x="160" y="182" class="relationship-text">Contiene</text>
        
        <!-- Tiene -->
        <polygon class="relationship" points="160,350 200,380 160,410 120,380" />
        <text x="160" y="382" class="relationship-text">Tiene</text>
        
        <!-- Supervisa -->
        <polygon class="relationship" points="310,250 350,280 310,310 270,280" />
        <text x="310" y="282" class="relationship-text">Supervisa</text>
        
        <!-- Asignada -->
        <polygon class="relationship" points="460,350 500,380 460,410 420,380" />
        <text x="460" y="382" class="relationship-text">Asignada</text>
        
        <!-- Conduce -->
        <polygon class="relationship" points="760,410 800,440 760,470 720,440" />
        <text x="760" y="442" class="relationship-text">Conduce</text>
        
        <!-- Descarga -->
        <polygon class="relationship" points="460,570 500,600 460,630 420,600" />
        <text x="460" y="602" class="relationship-text">Descarga</text>
        
        <!-- Apoya a -->
        <polygon class="relationship" points="910,250 950,280 910,310 870,280" />
        <text x="910" y="282" class="relationship-text">Apoya a</text>
        
        <!-- Consume (N a M) -->
        <polygon class="relationship" points="910,570 950,600 910,630 870,600" />
        <text x="910" y="602" class="relationship-text">Consume</text>
        
        <!-- Recibe (N a M) -->
        <polygon class="relationship" points="1220,310 1260,340 1220,370 1180,340" />
        <text x="1220" y="342" class="relationship-text">Recibe</text>


        <!-- ================= ENTIDADES (RECTÁNGULOS) ================= -->
        
        <rect class="entity" x="80" y="50" width="160" height="60" />
        <text x="160" y="80" class="entity-text">MACRODISTRITO</text>
        
        <rect class="entity" x="80" y="250" width="160" height="60" />
        <text x="160" y="280" class="entity-text">ZONA</text>
        
        <rect class="entity" x="80" y="450" width="160" height="60" />
        <text x="160" y="480" class="entity-text">RUTA</text>
        
        <rect class="entity" x="80" y="570" width="160" height="60" />
        <text x="160" y="600" class="entity-text">CENTRO DESTINO</text>
        
        <rect class="entity" x="680" y="50" width="160" height="60" />
        <text x="760" y="80" class="entity-text">PERSONA</text>
        
        <rect class="entity" x="380" y="250" width="160" height="60" />
        <text x="460" y="280" class="entity-text">JEFE DE ÁREA</text>
        
        <rect class="entity" x="680" y="250" width="160" height="60" />
        <text x="760" y="280" class="entity-text">CHOFER</text>
        
        <rect class="entity" x="980" y="250" width="160" height="60" />
        <text x="1060" y="280" class="entity-text">RECOLECTOR</text>
        
        <rect class="entity" x="680" y="570" width="160" height="60" />
        <text x="760" y="600" class="entity-text">VEHÍCULO</text>
        
        <rect class="entity" x="980" y="570" width="160" height="60" />
        <text x="1060" y="600" class="entity-text">INSUMO</text>


        <!-- ================= CARDINALIDADES ================= -->
        
        <!-- MACRODISTRITO (1) a ZONA (N) -->
        <text x="175" y="130" class="cardinality">1</text>
        <text x="175" y="235" class="cardinality">N</text>
        
        <!-- ZONA (1) a RUTA (N) -->
        <text x="175" y="335" class="cardinality">1</text>
        <text x="175" y="435" class="cardinality">N</text>
        
        <!-- JEFE (1) a ZONA (N) -->
        <text x="365" y="270" class="cardinality">1</text>
        <text x="255" y="270" class="cardinality">N</text>
        
        <!-- CHOFER (1) a RUTA (N) -->
        <text x="735" y="325" class="cardinality">1</text>
        <text x="260" y="470" class="cardinality">N</text>
        
        <!-- CHOFER (1) a RECOLECTOR (N) -->
        <text x="855" y="270" class="cardinality">1</text>
        <text x="965" y="270" class="cardinality">N</text>
        
        <!-- CHOFER (1) a VEHÍCULO (1) -->
        <text x="775" y="335" class="cardinality">1</text>
        <text x="775" y="555" class="cardinality">1</text>
        
        <!-- VEHÍCULO (N) a CENTRO DESTINO (1) -->
        <text x="660" y="590" class="cardinality">N</text>
        <text x="260" y="590" class="cardinality">1</text>
        
        <!-- VEHÍCULO (N) a INSUMO (N) -->
        <text x="855" y="590" class="cardinality">N</text>
        <text x="965" y="590" class="cardinality">M</text>
        
        <!-- PERSONA (N) a INSUMO (N) -->
        <text x="860" y="70" class="cardinality">N</text>
        <text x="1160" y="590" class="cardinality">M</text>

    </svg>
</div>

</body>
</html>
